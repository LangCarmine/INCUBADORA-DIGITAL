<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Postulación de Proyecto — Incubadora GTO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐣</text></svg>">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: {
                            dark: '#0B1F3A',
                            light: '#143054',
                            accent: '#10B981',
                            orange: '#F97316',
                            purple: '#8B5CF6',
                            bg: '#F3F6F9',
                            greenbg: '#E6F4EA'
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="min-h-screen flex flex-col bg-brand-bg">

    <!-- Header -->
    <header class="bg-brand-dark text-white px-6 py-3 flex justify-between items-center sticky top-0 z-50 shadow-md">
        <div class="flex items-center space-x-4">
            <div class="w-8 h-8 bg-white rounded-full flex items-center justify-center text-brand-dark font-bold text-xs">GTO</div>
            <div class="border-l border-gray-600 pl-4">
                <h2 class="text-sm font-semibold">Postulación de Proyecto</h2>
                <p class="text-xs text-gray-400">Ciclo 2026</p>
            </div>
        </div>
        <button onclick="logoutEmprendedor()" class="text-sm text-gray-300 hover:text-white flex items-center transition">
            <i class="fas fa-sign-out-alt mr-2"></i> Salir
        </button>
    </header>

    <!-- Contenido -->
    <main class="flex-grow w-full py-10 px-4">
        <div class="max-w-4xl mx-auto">

            <!-- Aviso de sesión activa -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 px-5 py-3 mb-6 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="w-8 h-8 rounded-full bg-brand-purple bg-opacity-10 flex items-center justify-center text-brand-purple">
                        <i class="fas fa-user text-xs"></i>
                    </div>
                    <div>
                        <p class="text-xs text-gray-400 uppercase">Sesión activa</p>
                        <p class="text-sm font-semibold text-brand-dark" id="emp-session-name">—</p>
                    </div>
                </div>
                <a href="mi-cuenta.html" class="text-xs text-brand-purple hover:underline">
                    <i class="fas fa-arrow-left mr-1"></i> Mi Cuenta
                </a>
            </div>

            <div class="mb-8">
                <h1 class="text-2xl font-bold text-brand-dark mb-1">Formulario de Postulación</h1>
                <p class="text-sm text-gray-500">Complete todos los campos para enviar su proyecto al Comité Directivo.</p>
            </div>

            <form id="projectForm" onsubmit="submitForm(event)">
                <div class="bg-white p-8 rounded-xl shadow-sm border border-gray-100 mb-6">
                    <div class="flex items-center space-x-3 mb-6">
                        <div class="w-6 h-6 rounded-full bg-brand-purple text-white flex items-center justify-center text-xs font-bold">A</div>
                        <h3 class="font-semibold text-brand-dark">Datos del Proyecto</h3>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="form-label">Nombre del Proyecto</label>
                            <input type="text" id="f_proyecto" required class="form-input" placeholder="Ej. AgroTech Bajío">
                        </div>
                        <div>
                            <label class="form-label">Giro Empresarial</label>
                            <select id="f_giro" required class="form-input bg-white">
                                <option value="">Seleccionar giro...</option>
                                <option>E-commerce y Retail</option>
                                <option>Desarrollo de Software / SaaS</option>
                                <option>Agro e Industria 4.0</option>
                                <option>Salud Digital</option>
                            </select>
                        </div>
                        <div>
                            <label class="form-label">Municipio de Origen</label>
                            <input type="text" id="f_municipio" required class="form-input" placeholder="Ej. León, Guanajuato">
                        </div>
                        <div>
                            <label class="form-label">Tiempo operando en el mercado</label>
                            <select id="f_tiempo" required class="form-input bg-white">
                                <option value="">Seleccionar tiempo...</option>
                                <option>Idea o Prototipo</option>
                                <option>Menos de 6 meses</option>
                                <option>6 a 12 meses</option>
                                <option>Más de 1 año</option>
                            </select>
                        </div>
                        <div class="md:col-span-2">
                            <label class="form-label">Nivel de Innovación</label>
                            <div class="flex w-full" id="innovation-selector">
                                <div class="flex-1 text-center innov-btn selected" onclick="setInnov(1, event)">1</div>
                                <div class="flex-1 text-center innov-btn" onclick="setInnov(2, event)">2</div>
                                <div class="flex-1 text-center innov-btn" onclick="setInnov(3, event)">3</div>
                                <div class="flex-1 text-center innov-btn" onclick="setInnov(4, event)">4</div>
                                <div class="flex-1 text-center innov-btn" onclick="setInnov(5, event)">5</div>
                            </div>
                            <input type="hidden" id="f_innovacion" value="1">
                        </div>
                    </div>
                </div>

                <div class="bg-brand-greenbg p-8 rounded-xl shadow-sm border border-green-200 mb-8">
                    <div class="flex items-center space-x-3 mb-6">
                        <div class="w-6 h-6 rounded-full bg-brand-accent text-white flex items-center justify-center text-xs font-bold">B</div>
                        <h3 class="font-semibold text-brand-dark">Información Estratégica Indispensable</h3>
                    </div>

                    <div class="space-y-5">
                        <div>
                            <label class="form-label text-emerald-800">1. Propuesta de Valor</label>
                            <textarea id="f_propuesta" required rows="2" class="form-input" placeholder="¿Qué problema resuelve y para quién? ¿Qué lo hace único frente a alternativas existentes?"></textarea>
                        </div>
                        <div>
                            <label class="form-label text-emerald-800">2. Plan de Negocio</label>
                            <textarea id="f_plan" required rows="2" class="form-input" placeholder="Describe el modelo operativo: segmento de clientes, canales de distribución, estructura de costos y metas a corto plazo."></textarea>
                        </div>
                        <div>
                            <label class="form-label text-emerald-800">3. Modelo de Monetización</label>
                            <textarea id="f_monetizacion" required rows="2" class="form-input" placeholder="¿Cómo genera o generará ingresos? (SaaS, comisiones, freemium, venta directa, etc.) Incluye cifras si las tienes."></textarea>
                        </div>
                        <div>
                            <label class="form-label text-emerald-800">4. ¿Qué requiere de nosotros?</label>
                            <textarea id="f_requiere" required rows="2" class="form-input" placeholder="Especifica el tipo de apoyo: capital semilla, mentoría, conexiones, tecnología, validación de mercado, etc."></textarea>
                        </div>
                    </div>
                </div>

                <div class="flex justify-end mb-12">
                    <button type="submit" class="bg-brand-orange hover:bg-orange-600 text-white font-semibold py-3 px-8 rounded-lg shadow-md transition flex items-center">
                        <i class="fas fa-paper-plane mr-2"></i> Enviar Postulación al Comité Directivo
                    </button>
                </div>
            </form>
        </div>
    </main>

    <!-- Notificación Flotante -->
    <div id="toast" class="fixed bottom-5 right-5 transform translate-y-20 opacity-0 transition-all duration-300 bg-brand-dark text-white px-6 py-3 rounded-lg shadow-xl z-[100] flex items-center">
        <i class="fas fa-check-circle text-brand-accent mr-3"></i>
        <span id="toast-msg">Postulación enviada con éxito</span>
    </div>

    <script src="auth.js"></script>
    <script src="scrypt.js"></script>
    <script>
        requireEmprendedorAuth();
        document.addEventListener('DOMContentLoaded', () => {
            const correo = sessionStorage.getItem('gto_emp_correo');
            const emprendedores = JSON.parse(localStorage.getItem('gto_emprendedores')) || [];
            const cuenta = emprendedores.find(x => x.correo === correo);
            const el = document.getElementById('emp-session-name');
            if (el) el.innerText = cuenta ? cuenta.nombre : 'Emprendedor';
        });
    </script>
</body>
</html>
