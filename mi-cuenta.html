<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Cuenta — Incubadora GTO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: {
                            dark: '#0B1F3A', light: '#143054', accent: '#10B981',
                            orange: '#F97316', purple: '#8B5CF6', bg: '#F3F6F9', greenbg: '#E6F4EA'
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="min-h-screen flex flex-col bg-brand-bg">

    <header class="bg-brand-dark text-white px-6 py-3 flex justify-between items-center sticky top-0 z-50 shadow-md">
        <div class="flex items-center space-x-4">
            <div class="w-8 h-8 bg-white rounded-full flex items-center justify-center text-brand-dark font-bold text-xs">GTO</div>
            <div class="border-l border-gray-600 pl-4">
                <h2 class="text-sm font-semibold">Mi Cuenta</h2>
                <p class="text-xs text-gray-400">Panel del Emprendedor</p>
            </div>
        </div>
        <button onclick="logoutEmprendedor()" class="text-sm text-gray-300 hover:text-white flex items-center transition">
            <i class="fas fa-sign-out-alt mr-2"></i> Salir
        </button>
    </header>

    <main class="flex-grow w-full py-10 px-4">
        <div class="max-w-4xl mx-auto">

            <!-- Datos del emprendedor -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 mb-8 flex items-center justify-between flex-wrap gap-4">
                <div class="flex items-center space-x-4">
                    <div class="w-12 h-12 rounded-full bg-brand-purple bg-opacity-10 flex items-center justify-center text-brand-purple">
                        <i class="fas fa-user text-lg"></i>
                    </div>
                    <div>
                        <p class="text-xs text-gray-400 uppercase">Bienvenido</p>
                        <p class="text-lg font-semibold text-brand-dark" id="emp-nombre-display">—</p>
                        <p class="text-xs text-gray-500" id="emp-correo-display">—</p>
                    </div>
                </div>
                <div class="text-right">
                    <p class="text-xs text-gray-400 uppercase">Propuestas registradas</p>
                    <p class="text-3xl font-bold text-brand-dark" id="emp-total-props">0</p>
                </div>
            </div>

            <!-- Botón nueva postulación -->
            <div id="nueva-postulacion-box" class="mb-8">
                <button onclick="irANuevaPostulacion()" id="btn-nueva-postulacion" class="w-full bg-brand-orange hover:bg-orange-600 text-white font-semibold py-4 px-8 rounded-xl shadow-md transition flex items-center justify-center">
                    <i class="fas fa-plus-circle mr-2"></i> Enviar Nueva Postulación
                </button>
                <div id="bloqueo-msg" class="hidden mt-3 text-sm text-orange-700 bg-orange-50 border border-orange-200 rounded-lg px-4 py-3 flex items-center">
                    <i class="fas fa-info-circle mr-2"></i>
                    <span>Tienes una propuesta pendiente de evaluación. Espera la decisión del comité antes de enviar otra.</span>
                </div>
            </div>

            <!-- Lista de propuestas -->
            <h2 class="text-xl font-bold text-brand-dark mb-4">Mis Propuestas</h2>
            <div id="mis-propuestas" class="space-y-4">
                <!-- Se llena dinámicamente -->
            </div>

        </div>
    </main>

    <div id="toast" class="fixed bottom-5 right-5 transform translate-y-20 opacity-0 transition-all duration-300 bg-brand-dark text-white px-6 py-3 rounded-lg shadow-xl z-[100] flex items-center">
        <i class="fas fa-check-circle text-brand-accent mr-3"></i>
        <span id="toast-msg">Notificación</span>
    </div>

    <script src="auth.js"></script>
    <script src="scrypt.js"></script>
    <script>
        requireEmprendedorAuth();
        document.addEventListener('DOMContentLoaded', renderMiCuenta);
    </script>
</body>
</html>
