<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Comité Directivo — Incubadora GTO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: {
                            dark: '#0B1F3A',
                            light: '#143054',
                            accent: '#10B981',
                            orange: '#F97316',
                            purple: '#8B5CF6',
                            bg: '#F3F6F9',
                            greenbg: '#E6F4EA'
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="min-h-screen bg-brand-bg flex items-center justify-center p-4">

    <div class="bg-white p-10 rounded-2xl shadow-sm border border-gray-100 w-full max-w-md">
        <div class="text-center mb-8">
            <div class="w-14 h-14 bg-brand-orange rounded-full flex items-center justify-center text-white mx-auto mb-4">
                <i class="fas fa-user-shield text-xl"></i>
            </div>
            <h1 class="text-2xl font-semibold text-brand-dark mb-1">Acceso Comité Directivo</h1>
            <p class="text-sm text-gray-500">Ingresa tus credenciales para evaluar propuestas</p>
        </div>

        <form id="adminLoginForm" onsubmit="handleAdminLogin(event)">
            <div class="space-y-5">
                <div>
                    <label class="form-label">Usuario</label>
                    <input type="text" id="admin_user" required class="form-input" placeholder="Ej. comite.gto" autocomplete="username">
                </div>
                <div>
                    <label class="form-label">Contraseña</label>
                    <input type="password" id="admin_pass" required class="form-input" placeholder="••••••••" autocomplete="current-password">
                </div>

                <div id="login-error" class="hidden text-sm text-red-600 bg-red-50 border border-red-200 rounded-lg px-4 py-2 flex items-center">
                    <i class="fas fa-exclamation-circle mr-2"></i>
                    <span id="login-error-msg">Credenciales incorrectas</span>
                </div>

                <button type="submit" class="w-full bg-brand-orange hover:bg-orange-600 text-white font-semibold py-3 px-8 rounded-lg shadow-md transition flex items-center justify-center">
                    <i class="fas fa-sign-in-alt mr-2"></i> Ingresar al Panel
                </button>
            </div>
        </form>

        <div class="mt-8 text-center text-xs text-gray-400 border-t pt-6">
            <a href="index.html" class="text-brand-purple hover:underline"><i class="fas fa-arrow-left mr-1"></i> Volver al inicio</a>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
